name: Research

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build PDF
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      TZ: Europe/Riga

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Prepare
        run: |
          rm -rf .ci-latex-tmp
          mkdir -p .ci-latex-tmp research/latest
          find research/latest -mindepth 1 -not -name '.gitkeep' -delete

      - name: Build
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: research/latex
          root_file: main.tex
          latexmk_use_xelatex: true
          extra_system_packages: biber
          args: >-
            -outdir=../../.ci-latex-tmp
            -jobname=research
            -file-line-error
            -interaction=nonstopmode

      - name: Export
        run: |
          repo="${GITHUB_REPOSITORY##*/}"
          name="${repo%-zpd}"

          mv ".ci-latex-tmp/research.pdf" "research/latest/${name}.pdf"
          rm -rf .ci-latex-tmp

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A research/latest

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "chore: refresh PDF"
          git push

  upload:
    name: Upload to Google Drive
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      DRIVE_ROOT: gdrive_research:2026/2027/research

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONFIG" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Upload
        run: |
          rclone sync . "$DRIVE_ROOT" \
            --exclude-from=.drive-exclude \
            --exclude "/.ci-latex-tmp/**" \
            --create-empty-src-dirs \
            --copy-links \
            --checksum \
            --delete-excluded
